<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="flagWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="flagBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="flagRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06b6d4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Фон круглый -->
  <rect width="512" height="512" rx="120" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Фоновое свечение -->
  <circle cx="256" cy="240" r="140" fill="#06b6d4" opacity="0.12" filter="blur(30px)"/>

  <!-- Бюллетень (Триколор) -->
  <g transform="translate(196, 75)" filter="url(#glow)">
    <path d="M0 10 C0 4.5 4.5 0 10 0 L110 0 C115.5 0 120 4.5 120 10 L120 45 L0 45 Z" fill="url(#flagWhite)"/>
    <rect y="45" width="120" height="45" fill="url(#flagBlue)"/>
    <path d="M0 90 L120 90 L120 145 C120 150.5 115.5 155 110 155 L10 155 C4.5 155 0 150.5 0 145 Z" fill="url(#flagRed)"/>
    <!-- Галочка на бюллетене -->
    <path d="M45 65 L55 77 L78 48" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Урна для голосования -->
  <g filter="url(#glow)">
    <!-- Крышка урны с прорезью -->
    <path d="M120 220 L392 220 L368 255 L144 255 Z" fill="#0f172a" stroke="url(#neonCyan)" stroke-width="6" stroke-linejoin="round"/>
    <rect x="180" y="232" width="152" height="8" rx="4" fill="#020617" stroke="#38bdf8" stroke-width="2"/>

    <!-- Корпус урны -->
    <path d="M144 255 L170 410 C172 422 182 430 194 430 L318 430 C330 430 340 422 342 410 L368 255 Z" 
          fill="#090d16" stroke="url(#neonCyan)" stroke-width="6" stroke-linejoin="round"/>

    <!-- Декоративные полосы на урне -->
    <line x1="200" y1="300" x2="312" y2="300" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <line x1="215" y1="340" x2="297" y2="340" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>

    <!-- Год 2026 -->
    <text x="256" y="395" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#38bdf8" letter-spacing="4">2026</text>
  </g>
</svg>
